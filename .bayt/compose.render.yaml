    build:
      additional_contexts:
        golaberto-caddy: service:golaberto-caddy
        golaberto-crud: service:golaberto-crud
        golaberto-electric: service:golaberto-electric
        golaberto-auth: service:golaberto-auth
        golaberto-served: service:golaberto-served
        plugins_omnishell-runtime-image: >-
          ${MONOREPO_COMPOSE_MODE:-docker-image://bonitao/omnishell:0.25.2@sha256:a807d1ac0bc336c8a6ecfaf2700cb5cad55404468716a4a5791ede8c3d1c1329}${MONOREPO_COMPOSE_MODE:+:plugins_omnishell-runtime-image}
      context: ..
      dockerfile: .bayt/Dockerfile.render
      target: render
      tags:
      - bayt-golaberto-render:${BAYT_IMAGE_TAG:-${COMPOSE_PROJECT_NAME}}
      - bayt-golaberto-render:latest
      args:
        BAYT_DIR: ${MONOREPO_COMPOSE_MODE:+apps/golaberto}
        BUILDKIT_SYNTAX: >-
          docker/dockerfile:1.27@sha256:4edf897a3ffa55b89f906fc8cc78afdb3f1834cc9c7083565e611a8a7d5fe99e
    depends_on:
      golaberto-caddy:
        condition: service_healthy
        restart: true
      golaberto-crud:
        condition: service_healthy
        restart: true
      golaberto-electric:
        condition: service_healthy
        restart: true
      golaberto-auth:
        condition: service_started
    develop:
      watch:
      - action: sync+restart
        path: ../shell/index.html
        target: /render/entry.html
    environment:
