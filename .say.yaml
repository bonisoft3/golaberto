# generated by pronto from program.cue — do not edit
say:
  self:
    version: v0.42.0
  doctor:
    do: 'use tools.nu [run-mise]; run-mise exec -- cue version; run-mise exec -- deno --version; run-mise where github:bonisoft3/pronto'
  generate:
    rulemap:
      auto-bayt:
        priority: 2
        cmds:
          - use: ./auto-bayt.nu
            do: auto-bayt
      auto-cue:
        cmds:
          - use: ./tools.nu
            do: tools run-cue cmd generate ./pronto
      omnishell:
        priority: 0
        cmds:
          - do: 'if (''program.cue'' | path exists) { use tools.nu [run-mise]; run-mise exec -- omnishell mode . | save --force program_terminal.cue }'
      pronto:
        priority: 1
        cmds:
          - do: |-
              if ('program.cue' | path exists) { let pkg = (open program.cue --raw | parse -r '(?m)^package\s+(\w+)\s*$' | first | get capture0); $'package ($pkg)
              loop: surface: sources: pronto: ""
              ' | save --force program_pronto.cue; use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-write=. --allow-run --allow-env ($pronto | path join write.ts) . }
  build:
    do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-write=. --allow-run --allow-env ($pronto | path join write.ts) .'
  integrate:
    rulemap:
      builtin:
        stop: false
      constraints:
        priority: 1
        cmds:
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'golaberto') --profile '*' -f .bayt/compose.check-constraints.closure.yaml up bayt --abort-on-container-failure --exit-code-from bayt --build --remove-orphans --attach-dependencies
      acceptance:
        priority: 1
        cmds:
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'golaberto') --profile '*' -f .bayt/compose.check-acceptance.closure.yaml up bayt --abort-on-container-failure --exit-code-from bayt --build --remove-orphans --attach-dependencies
      visual:
        cmds:
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'golaberto') up -d --wait --build launch
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'golaberto') --profile '*' -f .bayt/compose.integrate.closure.yaml up bayt --abort-on-container-failure --exit-code-from bayt --build --remove-orphans --attach-dependencies
  launch:
    rulemap:
      builtin:
        cmds:
          - do: 'if not (''.certs/localhost.pem'' | path exists) { mkdir .certs; mise exec -- mkcert -cert-file .certs/localhost.pem -key-file .certs/localhost-key.pem localhost 127.0.0.1 ::1 }'
          - do: launch
            use: ./launch.nu
  lint:
    rulemap:
      cue:
        cmds:
          - do: mise exec -- cue vet ./...
      rpk:
        cmds:
          - do: mise exec -- redpanda-connect lint --skip-env-var-check docker/golaberto-standings.yaml docker/golaberto-game-cards.yaml docker/golaberto-player-stats.yaml docker/golaberto-rounds.yaml
      facts:
        priority: 1
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-facts.ts) .'
      sql:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-sql.ts) .'
      identity:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join identity.ts) check .'
      admit:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ((run-mise where github:bonisoft3/mecha | str trim) | path join services compute deno.json) --frozen --unstable-worker-options --allow-read --allow-env ((run-mise where github:bonisoft3/mecha | str trim) | path join services compute admit.ts) "computations/ratings.js" "computations/chances.js"'
      caddy:
        cmds:
          - do: 'with-env {ELECTRIC_SECRET: lint} { mise exec -- caddy adapt --config docker/Caddyfile --adapter caddyfile out> (if $nu.os-info.name == "windows" { "NUL" } else { "/dev/null" }) }'
      handlers:
        cmds:
          - do: 'use tools.nu [run-mise]; run-mise exec -- omnishell check handlers .'
      markup:
        cmds:
          - do: 'use tools.nu [run-mise]; run-mise exec -- omnishell check markup .'
      derive:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read=. ($pronto | path join derive.ts) --self-test'
      types:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); let files = do { cd $pronto; [ ...(glob --no-dir --exclude [*_test.ts *.test.ts] ''*.ts'') ...(glob --no-dir ''scales/*.ts'') ] }; run-mise exec -- deno check --config ($pronto | path join deno.json) ...$files'
      proto:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-proto.ts) .'
  release:
    rulemap:
      pages:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run -A --config ($pronto | path join bundle deno.json) ($pronto | path join bundle derived.ts) . --tables game_card,game_importance,phase_round,player_rating,player_stat,position_chance,rating_eval,standing,team_chance,team_game,team_rating,zone_chance --streams golaberto-game-cards,golaberto-player-stats,golaberto-rounds,golaberto-standings --out dist/derived.sql'
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run -A --config ($pronto | path join bundle deno.json) ($pronto | path join bundle bundle.ts) . --omnishell (run-mise where github:bonisoft3/omnishell | str trim) --mecha (run-mise where github:bonisoft3/mecha | str trim) --out dist/browser --base ($env.SAY_RELEASE_ARGS_BASE? | default "") --derived dist/derived.sql'
          - do: 'if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { release --skip=validate --clean } else { release --snapshot --skip=validate --clean }'
            use: ./release.nu
          - do: 'if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { use semver.nu [tag-on-head]; let tag = (tag-on-head); if ($tag | is-empty) { error make {msg: "no release tag on HEAD to push"} }; git push origin $tag }'
        platform: pages
  setup:
    rulemap:
      builtin:
        cmds:
          - do: setup
            use: ./setup.nu
          - do: mkdir .certs
          - do: 'mise exec -- mkcert -cert-file .certs/localhost.pem -key-file .certs/localhost-key.pem localhost 127.0.0.1 ::1'
          - do: 'print ''the browser trusts this certificate only once you run: mise exec -- mkcert -install'''
  test:
    rulemap:
      builtin:
        stop: false
        cmds:
          - do: test
            use: ./test.nu
      standings:
        cmds:
          - do: mise exec -- redpanda-connect test pipelines/standings.yaml pipelines/rounds.yaml pipelines/game-cards.yaml pipelines/player-stats.yaml
      prerender:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); let out = (mktemp -d); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read $"--allow-write=($out)" ($pronto | path join prerender.ts) . $out https://localhost:8443 (run-mise where github:bonisoft3/omnishell | str trim); rm -rf $out'
      computations:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno test --config ((run-mise where github:bonisoft3/mecha | str trim) | path join services compute deno.json) --frozen --permit-no-files --unstable-worker-options --allow-read --allow-ffi --allow-env computations'
      machines:
        cmds:
          - do: 'use tools.nu [run-mise]; run-mise exec -- omnishell check machines .'
      i18n:
        cmds:
          - do: 'use tools.nu [run-mise]; run-mise exec -- omnishell check i18n .'
      battery:
        cmds:
          - do: 'use tools.nu [run-mise]; run-mise exec -- omnishell check battery .'
