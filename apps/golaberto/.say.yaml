# generated by pronto from program.cue — do not edit
say:
  generate:
    rulemap:
      omnishell:
        priority: 0
        cmds:
          - do: mise run omnishell -- mode . --local | save --force program_terminal.cue
  integrate:
    rulemap:
      builtin:
        stop: false
      constraints:
        priority: 1
        cmds:
          - do: deno test --config tests/deno.json --no-lock --allow-env --allow-run=docker tests/constraints.ts
      acceptance:
        priority: 1
        cmds:
          - do: deno test --config tests/deno.json --no-lock --allow-all --unsafely-ignore-certificate-errors=localhost tests/acceptance.ts
      replay:
        priority: 1
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-write --allow-run --allow-env ($pronto | path join check-replay.ts) .'
      visual:
        cmds:
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'golaberto') up -d --wait --build launch
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'golaberto') --profile '*' -f .bayt/compose.integrate.closure.yaml up bayt --abort-on-container-failure --exit-code-from bayt --build --remove-orphans --attach-dependencies
  launch:
    rulemap:
      builtin:
        cmds:
          - do: 'if not (''.certs/localhost.pem'' | path exists) { mkdir .certs; mise exec -- mkcert -cert-file .certs/localhost.pem -key-file .certs/localhost-key.pem localhost 127.0.0.1 ::1 }'
          - do: launch
            use: ./launch.nu
  lint:
    rulemap:
      cue:
        cmds:
          - do: mise exec -- cue vet ./...
      rpk:
        cmds:
          - do: mise exec -- redpanda-connect lint --skip-env-var-check docker/golaberto-standings.yaml docker/golaberto-game-cards.yaml docker/golaberto-player-stats.yaml docker/golaberto-rounds.yaml
      facts:
        priority: 1
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-facts.ts) .'
      sql:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-sql.ts) .'
      identity:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join identity.ts) check .'
      admit:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ("../../libraries/mecha" | path join services compute deno.json) --frozen --unstable-worker-options --allow-read --allow-env ("../../libraries/mecha" | path join services compute admit.ts) "computations/ratings.js" "computations/chances.js"'
      caddy:
        cmds:
          - do: 'with-env {ELECTRIC_SECRET: lint} { mise exec -- caddy adapt --config docker/Caddyfile --adapter caddyfile out> (if $nu.os-info.name == "windows" { "NUL" } else { "/dev/null" }) }'
      handlers:
        cmds:
          - do: mise run omnishell -- check handlers .
      markup:
        cmds:
          - do: mise run omnishell -- check markup .
      derive:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read=. ($pronto | path join derive.ts) --self-test'
      types:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; let files = do { cd $pronto; [ ...(glob --no-dir ''*.ts'') ...(glob --no-dir ''scales/*.ts'') ] }; run-mise exec -- deno check --config ($pronto | path join deno.json) ...$files'
      proto:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-proto.ts) .'
  setup:
    rulemap:
      builtin:
        cmds:
          - do: setup
            use: ./setup.nu
          - do: mkdir .certs
          - do: 'mise exec -- mkcert -cert-file .certs/localhost.pem -key-file .certs/localhost-key.pem localhost 127.0.0.1 ::1'
          - do: 'print ''the browser trusts this certificate only once you run: mise exec -- mkcert -install'''
  test:
    rulemap:
      builtin:
        stop: false
        cmds:
          - do: test
            use: ./test.nu
      standings:
        cmds:
          - do: mise exec -- redpanda-connect test pipelines/standings.yaml pipelines/rounds.yaml pipelines/game-cards.yaml pipelines/player-stats.yaml
      prerender:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; let out = (mktemp -d); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read $"--allow-write=($out)" ($pronto | path join prerender.ts) . $out https://localhost:8443; rm -rf $out'
      computations:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno test --config ("../../libraries/mecha" | path join services compute deno.json) --frozen --permit-no-files --unstable-worker-options --allow-read --allow-ffi --allow-env computations'
      machines:
        cmds:
          - do: mise run omnishell -- check machines .
      i18n:
        cmds:
          - do: mise run omnishell -- check i18n .
      battery:
        cmds:
          - do: mise run omnishell -- check battery .
