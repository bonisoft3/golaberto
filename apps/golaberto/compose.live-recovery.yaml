# Local recovery override: use only with COMPOSE_PROJECT_NAME=golaberto.
# Retains the original archive volume. Other project names require their own
# pre-existing recovered volume and cannot silently mount the live database.
services:
  apps_golaberto-transform:
    environment:
      PLAYER_STATS_BOOTSTRAP: "false"
      # Keep bulk projection rebuilds from exhausting the local VM.
      # Go treats this as a soft GC target, not a hard process limit.
      GOMEMLIMIT: "1GiB"
  apps_golaberto-electric:
    environment:
      # Evict old local subscriptions rather than retaining every guest scope.
      # Evicted clients automatically create fresh subscriptions.
      ELECTRIC_MAX_SHAPES: "64"
      ELECTRIC_SHAPE_SUSPEND_CONSUMER: "true"
volumes:
  golaberto-archive:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-golaberto}-restored-20261004
