# Source triggers own invalidation. The durable queue survives worker restarts
# and coalesces repeated changes before each bounded reconstruction batch.
input:
  broker:
    inputs:
      - generate:
          count: 1
          interval: ""
          auto_replay_nacks: false
          mapping: 'root = {"batch_size": 1}'
      - generate:
          interval: 5s
          auto_replay_nacks: false
          mapping: 'root = {"batch_size": 1}'
pipeline:
  threads: 1
output:
  http_client:
    url: ${CRUD_URL}/rpc/refresh_team_campaigns
    verb: POST
    max_in_flight: 1
    timeout: 25s
    retries: 0
    headers:
      Content-Type: application/json
      Authorization: Bearer ${SERVICE_JWT}
    successful_on: [200, 204]
