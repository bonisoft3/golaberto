<!doctype html>
<html lang="pt-BR" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="O banco de dados aberto do futebol — campeonatos, tabelas, jogos, gols e elencos, mantido pelos seus leitores.">
<!-- This one document answers at every route, so the URL it arrives under is
     not where it lives: without a base, ./boot.js is /boot.js at /games and
     nothing on the page runs at all. Links are composed absolute and are
     unaffected. -->
<base href="/shell/">
<title>Loading…</title>
<link rel="icon" href="/shell/favicon.ico">
<link rel="stylesheet" href="./shell.css">
<link rel="stylesheet" href="./design.css">
<link rel="modulepreload" href="/omnishell/interpreter/shell.js">
<link rel="modulepreload" href="/omnishell/interpreter/chrome.js">
<link rel="modulepreload" href="/omnishell/interpreter/screen.js">
<link rel="modulepreload" href="/omnishell/interpreter/fragment.js">
<link rel="modulepreload" href="/omnishell/interpreter/render.js">
<link rel="modulepreload" href="/omnishell/interpreter/vendor/messages.js">
<script type="speculationrules">
{
  "prefetch": [
    {
      "source": "document",
      "where": {
        "and": [
          { "href_matches": "/*" },
          { "not": { "href_matches": "/auth/*" } },
          { "not": { "href_matches": "/crud/*" } },
          { "not": { "href_matches": "/electric/*" } },
          { "not": { "href_matches": "/srv/*" } },
          { "not": { "href_matches": "/shell/*" } }
        ]
      },
      "eagerness": "moderate"
    }
  ]
}
</script>
</head>
<body>
<main id="app"></main>
<script type="module" src="./boot.js"></script>
</body>
</html>
