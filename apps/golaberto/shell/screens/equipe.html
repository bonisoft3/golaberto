<!-- generated by pronto from program.cue — do not edit -->
<section class="screen" data-screen="equipe">
<header class="masthead">
  <a class="wordmark" data-route="principal" aria-label="{msg.brand}"><b data-text="{msg.brand_gol}"></b><span data-text="{msg.brand_aberto}"></span></a>
  <nav class="langs" aria-label="{msg.lang_label}">
    <a data-route="equipe" data-param-id="{param.id}" data-locale="pt-BR" data-locale-current="page" lang="pt-BR"><span class="long" data-text="{msg.lang_pt}"></span><span class="short" data-text="{msg.lang_pt_short}"></span></a>
    <a data-route="equipe" data-param-id="{param.id}" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="equipe" data-param-id="{param.id}" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="equipe" data-param-id="{param.id}" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="equipe" data-param-id="{param.id}" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="equipe" data-param-id="{param.id}" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<div data-live="team" data-filter="id=eq.{param.id}" data-exit-motion="none" data-empty="{msg.team_gone}">
  <template data-item>
    <article class="team">
      <h1 class="band"><span class="archive-icon" data-text="{id}|{name}" data-text-format="team-badge"></span><span data-text="{name}"></span></h1>
      <div class="page">
        <div class="content">
          <dl class="game-facts">
            <dt data-text="{msg.team_full_name}"></dt><dd data-text="{full_name}"></dd>
            <dt data-text="{msg.team_city}"></dt><dd data-text="{city}"></dd>
            <dt data-text="{msg.team_country}"></dt><dd><span class="archive-icon" data-text="{country}" data-text-format="country-flag"></span><span data-text="{country}"></span></dd>
            <dt data-text="{msg.team_founded}"></dt><dd data-text="{foundation_display}"></dd>
            <dt data-text="{msg.team_rating}"></dt><dd class="rating" data-live="team_rating" data-filter="team_id=eq.{id}&limit=1" data-order="measure_date.desc" data-empty=""><template data-item><abbr title="{msg.team_rating_long}" data-text="{rating}" data-text-format="number"></abbr></template></dd>
            <dt data-text="{msg.game_stadium}"></dt><dd data-live="stadium" data-filter="id=eq.{stadium_id}" data-empty=""><template data-item><span data-text="{name}"></span></template></dd>
          </dl>
          <section class="team-next">
            <h2 data-text="{msg.team_next}"></h2>
<ol class="games team-games" data-live="team_game" data-filter="team_id=eq.{id}&played=is.false&limit=5" data-order="day.asc,kickoff.asc" data-empty="{msg.games_none_upcoming}">
  <template data-item>
    <li><a class="game-row" data-route="jogo" data-param-id="{game_id}" data-played="{played}" data-result="{result}">
      <span class="when"><span class="day" data-text="{day_display}"></span> <span class="hour" data-text="{kickoff_local}"></span></span>
      <span class="where" data-text="{championship_name}"></span>
      <span class="home"><span class="venue" data-text="{msg[side]}"></span> <span class="archive-icon" data-text="{opponent_id}|{opponent_name}" data-text-format="team-badge"></span><span data-text="{opponent_name}"></span></span>
      <span class="score"><b data-text="{goals_for}"></b><i>x</i><b data-text="{goals_against}"></b></span>
      <span class="away"></span>
    </a></li>
  </template>
</ol>
          </section>
          <section class="team-results">
            <h2 data-text="{msg.team_results}"></h2>
<ol class="games team-games" data-live="team_game" data-filter="team_id=eq.{id}&played=is.true&limit=10" data-order="day.desc,kickoff.desc" data-empty="{msg.games_none_results}">
  <template data-item>
    <li><a class="game-row" data-route="jogo" data-param-id="{game_id}" data-played="{played}" data-result="{result}">
      <span class="when"><span class="day" data-text="{day_display}"></span> <span class="hour" data-text="{kickoff_local}"></span></span>
      <span class="where" data-text="{championship_name}"></span>
      <span class="home"><span class="venue" data-text="{msg[side]}"></span> <span class="archive-icon" data-text="{opponent_id}|{opponent_name}" data-text-format="team-badge"></span><span data-text="{opponent_name}"></span></span>
      <span class="score"><b data-text="{goals_for}"></b><i>x</i><b data-text="{goals_against}"></b></span>
      <span class="away"><i class="outcome" title="{msg[result]}"></i><span class="visually-hidden" data-text="{msg[result]}"></span></span>
    </a></li>
  </template>
</ol>
          </section>
          <section class="squads">
            <h2 data-text="{msg.team_squads}"></h2>
            <table class="grid squad-table">
              <thead><tr><th scope="col" class="champ" data-text="{msg.col_championship}"></th><th scope="col" class="name"><abbr title="{msg.col_player_long}" data-text="{msg.col_player}"></abbr></th><th scope="col" class="num"><abbr title="{msg.col_pos_long}" data-text="{msg.col_pos}"></abbr></th><th scope="col" class="num"><abbr title="{msg.col_played_long}" data-text="{msg.col_played}"></abbr></th><th scope="col" class="num wide"><abbr title="{msg.col_started_long}" data-text="{msg.col_started}"></abbr></th><th scope="col" class="num wide"><abbr title="{msg.col_came_on_long}" data-text="{msg.col_came_on}"></abbr></th><th scope="col" class="num wide"><abbr title="{msg.col_minutes_long}" data-text="{msg.col_minutes}"></abbr></th><th scope="col" class="num"><abbr title="{msg.col_goals_long}" data-text="{msg.col_goals}"></abbr></th><th scope="col" class="num wide"><abbr title="{msg.col_yellow_long}" data-text="{msg.col_yellow}"></abbr></th><th scope="col" class="num wide"><abbr title="{msg.col_red_long}" data-text="{msg.col_red}"></abbr></th></tr></thead>
              <tbody data-live="player_stat" data-filter="team_id=eq.{id}" data-order="championship_name.asc,played.desc,minutes.desc,player_name.asc" data-empty="{msg.team_no_squads}">
                <template data-item><tr><td class="champ"><a data-route="campeonato" data-param-id="{championship_id}"><span class="archive-icon" data-text="{championship_name}" data-text-format="country-flag"></span><span data-text="{championship_name}"></span></a></td><td class="name"><a data-route="jogador" data-param-id="{player_id}" data-text="{player_name}"></a></td><td class="num" data-text="{position}"></td><td class="num" data-text="{played}"></td><td class="num wide" data-text="{started}"></td><td class="num wide" data-text="{came_on}"></td><td class="num wide" data-text="{minutes}"></td><td class="num" data-text="{goals}"></td><td class="num wide" data-text="{yellow}"></td><td class="num wide" data-text="{red}"></td></tr></template>
              </tbody>
            </table>
          </section>
        </div>
        <aside class="side">
          <p><a data-route="equipes" data-text="{msg.back_teams}"></a></p>
          <p data-text="{msg.about}"></p>
        </aside>
      </div>
    </article>
  </template>
</div>
</section>
