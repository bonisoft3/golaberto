<!-- generated by pronto from program.cue — do not edit -->
<section class="screen" data-screen="estadio">
<header class="masthead">
  <a class="wordmark" data-route="principal" aria-label="{msg.brand}"><b data-text="{msg.brand_gol}"></b><span data-text="{msg.brand_aberto}"></span></a>
  <nav class="langs" aria-label="{msg.lang_label}">
    <a data-route="estadio" data-param-id="{param.id}" data-locale="pt-BR" data-locale-current="page" lang="pt-BR"><span class="long" data-text="{msg.lang_pt}"></span><span class="short" data-text="{msg.lang_pt_short}"></span></a>
    <a data-route="estadio" data-param-id="{param.id}" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="estadio" data-param-id="{param.id}" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="estadio" data-param-id="{param.id}" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="estadio" data-param-id="{param.id}" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="estadio" data-param-id="{param.id}" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<div data-live="stadium" data-filter="id=eq.{param.id}" data-exit-motion="none" data-empty="{msg.stadium_gone}">
  <template data-item>
    <article class="venue">
      <h1 class="band" data-text="{name}"></h1>
      <div class="page">
        <div class="content">
          <dl class="game-facts">
            <dt data-text="{msg.team_full_name}"></dt><dd data-text="{full_name}"></dd>
            <dt data-text="{msg.col_city}"></dt><dd data-text="{city}"></dd>
            <dt data-text="{msg.col_country}"></dt><dd><span class="archive-icon" data-text="{country}" data-text-format="country-flag"></span><span data-text="{country}|{msg.geography_names}" data-text-format="geography-label"></span></dd>
          </dl>
          <section class="home-teams">
            <h2 data-text="{msg.stadium_teams}"></h2>
            <ul class="chips" data-live="team" data-filter="stadium_id=eq.{id}" data-order="name.asc" data-empty="{msg.stadium_no_teams}">
              <template data-item><li><a class="chip" data-route="equipe" data-param-id="{id}"><span class="archive-icon" data-text="{id}|{name}" data-text-format="team-badge"></span><span data-text="{name}"></span></a></li></template>
            </ul>
          </section>
          <section class="venue-games">
            <h2 data-text="{msg.stadium_games}"></h2>
<div class="paged-read" data-live="archive_page" data-filter="id=eq.stadium-history-{id}" data-machine='{"field":"state","initial":"browsing","context":{"owner_id":"{id}","offset":0,"next_offset":40,"page":1},"states":{"browsing":{"on":{"click@stadium-history-previous":{"assign":{"offset":{"type":"page-value","params":{"step":-40,"field":"offset"}},"next_offset":{"type":"page-value","params":{"step":-40,"field":"next_offset"}},"page":{"type":"page-value","params":{"step":-40,"field":"page"}}}},"click@stadium-history-next":{"assign":{"offset":{"type":"page-value","params":{"step":40,"field":"offset"}},"next_offset":{"type":"page-value","params":{"step":40,"field":"next_offset"}},"page":{"type":"page-value","params":{"step":40,"field":"page"}}}}}}}}' data-empty-row='{"id":"stadium-history-{id}","owner_id":"{id}","offset":0,"next_offset":40,"page":1,"state":"browsing"}'>
  <div class="page-window">

<ol class="games" data-live="game_card" data-select="*,championship(show_country),home:home_id(country),away:away_id(country)" data-filter="stadium_id=eq.{owner_id}&offset={offset}&limit=40" data-order="day.desc,kickoff.desc" data-empty="{msg.stadium_no_games}">
  <template data-item>
    <li><a class="game-row" data-show-country="{championship.show_country}" data-route="jogo" data-param-id="{id}" data-played="{played}">
      <span class="when"><span class="day" data-text="{day_display}"></span> <span class="hour" data-text="{kickoff_local}"></span></span>
      <span class="where" data-text="{championship_name}|{msg.geography_names}" data-text-format="geography-label"></span>
      <span class="home"><span class="team-name" data-text="{home_name}"></span><span class="team-icons"><span class="archive-icon team-flag" data-text="{championship.show_country}|{home.country}" data-text-format="country-flag"></span><span class="archive-icon team-badge" data-text="{home_id}|{home_name}" data-text-format="team-badge"></span></span></span>
      <span class="score"><b data-text="{home_score}"></b><i>x</i><b data-text="{away_score}"></b></span>
      <span class="away"><span class="team-icons"><span class="archive-icon team-badge" data-text="{away_id}|{away_name}" data-text-format="team-badge"></span><span class="archive-icon team-flag" data-text="{championship.show_country}|{away.country}" data-text-format="country-flag"></span></span><span class="team-name" data-text="{away_name}"></span></span>
    </a></li>
  </template>
</ol>
<nav class="archive-pager" data-page-offset="{offset}" aria-label="{msg.archive_pages}">
  <button id="stadium-history-previous" type="button" class="btn-quiet page-previous" data-text="{msg.page_previous}"></button>
  <span class="page-status"><span data-text="{msg.page_label}"></span> <b data-text="{page}" data-text-format="number"></b></span>
  <span data-live="game_card" data-filter="stadium_id=eq.{owner_id}&amp;offset={next_offset}&amp;limit=1" data-order='day.desc,kickoff.desc' data-empty=""><template data-item><i data-next-page hidden></i></template></span>
  <button id="stadium-history-next" type="button" class="btn-quiet page-next" data-text="{msg.page_next}"></button>
</nav>
  </div>
</div>
          </section>
        </div>
        <aside class="side">
          <p><a data-route="estadios" data-text="{msg.back_stadiums}"></a></p>
          <p data-text="{msg.about}"></p>
        </aside>
      </div>
    </article>
  </template>
</div>
</section>
