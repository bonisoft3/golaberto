<!-- generated by pronto from program.cue — do not edit -->
<section class="screen" data-screen="jogos">
<header class="masthead">
  <a class="wordmark" data-route="principal" aria-label="{msg.brand}"><b data-text="{msg.brand_gol}"></b><span data-text="{msg.brand_aberto}"></span></a>
  <nav class="langs" aria-label="{msg.lang_label}">
    <a data-route="jogos" data-locale="pt-BR" data-locale-current="page" lang="pt-BR"><span class="long" data-text="{msg.lang_pt}"></span><span class="short" data-text="{msg.lang_pt_short}"></span></a>
    <a data-route="jogos" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="jogos" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="jogos" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="jogos" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="jogos" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<h1 class="band" data-text="{msg.games_title}"></h1>
<div class="page">
  <div class="content" data-live="games_view" data-filter="id=eq.games" data-machine='{"field":"state","initial":"upcoming","states":{"upcoming":{"on":{"click@games-tab-results":{"target":"results"}}},"results":{"on":{"click@games-tab-upcoming":{"target":"upcoming"}}}}}' data-project='{"up":{"eq":["state","upcoming"]},"res":{"eq":["state","results"]}}'>
    <template data-item>
      <div class="games-view" data-view="{state}">
        <div class="tabs" role="tablist" aria-label="{msg.games_title}">
          <button type="button" id="games-tab-upcoming" role="tab" aria-selected="{up}" data-text="{msg.games_upcoming}"></button>
          <button type="button" id="games-tab-results" role="tab" aria-selected="{res}" data-text="{msg.games_results}"></button>
        </div>
<ol class="games upcoming" data-live="game_card" data-filter="played=is.false&kickoff=not.is.null&limit=40" data-order="kickoff.asc" data-empty="{msg.games_none_upcoming}">
  <template data-item>
    <li><a class="game-row" data-route="jogo" data-param-id="{id}" data-played="{played}">
      <span class="when"><span class="day" data-text="{day_display}"></span> <span class="hour" data-text="{kickoff_local}"></span></span>
      <span class="where" data-text="{championship_name}"></span>
      <span class="home"><span class="archive-icon" data-text="{home_id}|{home_name}" data-text-format="team-badge"></span><span data-text="{home_name}"></span></span>
      <span class="score"><b data-text="{home_score}"></b><i>x</i><b data-text="{away_score}"></b></span>
      <span class="away"><span class="archive-icon" data-text="{away_id}|{away_name}" data-text-format="team-badge"></span><span data-text="{away_name}"></span></span>
    </a></li>
  </template>
</ol>
<ol class="games results" data-live="game_card" data-filter="played=is.true&limit=40" data-order="day.desc,kickoff.desc" data-empty="{msg.games_none_results}">
  <template data-item>
    <li><a class="game-row" data-route="jogo" data-param-id="{id}" data-played="{played}">
      <span class="when"><span class="day" data-text="{day_display}"></span> <span class="hour" data-text="{kickoff_local}"></span></span>
      <span class="where" data-text="{championship_name}"></span>
      <span class="home"><span class="archive-icon" data-text="{home_id}|{home_name}" data-text-format="team-badge"></span><span data-text="{home_name}"></span></span>
      <span class="score"><b data-text="{home_score}"></b><i>x</i><b data-text="{away_score}"></b></span>
      <span class="away"><span class="archive-icon" data-text="{away_id}|{away_name}" data-text-format="team-badge"></span><span data-text="{away_name}"></span></span>
    </a></li>
  </template>
</ol>
      </div>
    </template>
  </div>
  <aside class="side"><p data-text="{msg.about}"></p></aside>
</div>
</section>
