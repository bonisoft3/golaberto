      json: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      order: text
      beyond: []
    timestamp:
      sql: portable_timestamp
      base:
        - timestamptz
        - timestamp with time zone
      json: string
      pattern: '^(000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-9][0-9]{3})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{6}Z$'
      order: text
      beyond:
        - calendar
    duration:
      sql: portable_duration
      base:
        - interval
      json: string
      pattern: '^PT(0|[1-9][0-9]*)(\.[0-9]{0,5}[1-9])?S$'
      order: duration
      beyond:
        - duration-range
    decimal:
      base:
        - numeric
        - decimal
      json: string
      pattern: '^(0|-?[1-9][0-9]*|-?(0|[1-9][0-9]*)\.[0-9]*[1-9])$'
      order: decimal
      beyond:
        - decimal-profile
    date:
      sql: portable_date
      base:
        - date
      json: string
      pattern: '^(000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-9][0-9]{3})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
      order: text
      beyond:
        - calendar
    time:
      sql: portable_time
      base:
        - time
        - time without time zone
      json: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{6}$'
      order: text
      beyond: []
    timezone:
      sql: portable_timezone
      base: []
      json: string
      pattern: '^[A-Za-z0-9+_/-]+$'
      order: none
      beyond:
        - tzdb
    json:
      sql: portable_json
      base:
        - json
        - jsonb
      json: value
      order: none
      beyond:
        - scalar-values
        - finite-numbers
    geojson:
      sql: portable_geojson
      base:
        - geometry
        - geography
      json: value
      order: none
      beyond:
        - scalar-values
        - finite-numbers
        - ring-closure
  aliases:
    text: string
