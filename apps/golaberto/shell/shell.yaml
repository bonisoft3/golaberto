types:
  types:
    string:
      sql: portable_string
      base:
        - text
        - varchar
        - bpchar
        - tsvector
      json: string
      refuse: \x00
      order: text
      beyond:
        - scalar-values
    bool:
      sql: portable_bool
      base:
        - bool
        - boolean
      json: boolean
      order: boolean
      beyond: []
    int32:
      sql: portable_int32
      base:
        - int2
        - int4
        - integer
        - smallint
      json: number
      min: -2147483648
      max: 2147483647
      order: number
      beyond: []
    int64:
      sql: portable_int64
      base:
        - int8
        - bigint
      json: string
      pattern: '^(0|-?[1-9][0-9]*)$'
      order: integer
      beyond:
        - int64-range
    double:
      sql: portable_double
      base:
        - float4
        - float8
        - double precision
        - real
      json: number
      order: number
      beyond: []
    bytes:
      sql: portable_bytes
      base:
        - bytea
      json: string
      pattern: '^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
      order: none
      beyond: []
