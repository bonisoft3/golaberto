# generated by pronto from program.cue — do not edit
version: '2.2'
pipelines:
  - id: cdc-to-bus
    status: running
    processors:
      - id: stamp-collection-after
        plugin: 'builtin:field.set'
        condition: '{{ if .Payload.After }}true{{ else }}false{{ end }}'
        settings:
          field: .Payload.After.__table
          value: '{{ index .Metadata "opencdc.collection" }}'
      - id: stamp-collection-before
        plugin: 'builtin:field.set'
        condition: '{{ if .Payload.Before }}true{{ else }}false{{ end }}'
        settings:
          field: .Payload.Before.__table
          value: '{{ index .Metadata "opencdc.collection" }}'
      - id: stringify-before
        plugin: 'builtin:json.encode'
        settings:
          field: .Payload.Before
      - id: retain-before
        plugin: 'builtin:field.set'
        condition: '{{ if and .Payload.After .Payload.Before }}true{{ else }}false{{ end }}'
        settings:
          field: .Payload.After.__before
          value: '{{ printf "%s" .Payload.Before }}'
      - id: stringify-after
        plugin: 'builtin:json.encode'
        settings:
          field: .Payload.After
      - id: restore-deleted-row
        plugin: 'builtin:field.set'
        settings:
          field: .Payload.After
          value: '{{ if .Payload.After }}{{ printf "%s" .Payload.After }}{{ else }}{{ printf "%s" .Payload.Before }}{{ end }}'
    connectors:
      - id: postgres-source
        type: source
        plugin: 'builtin:postgres'
        settings:
          url: '${DATABASE_URL}'
          cdcMode: logrepl
          snapshotMode: never
          logrepl.publicationName: golaberto_cdc
          logrepl.slotName: golaberto_conduit_slot
          logrepl.withAvroSchema: 'false'
          tables: 'championship,phase,game,team,player,player_game,goal,stage_group,team_group,zone,team_rating,standing,stadium,referee'
      - id: bus-destination
        type: destination
        plugin: 'standalone:http'
        settings:
          url: 'http://mesh-events:3500/v1.0/publish/redis-streams/cdc-events'
          validateConnection: 'false'
