<!doctype html>
<html lang="pt-BR" dir="ltr">
<head>
<meta charset="utf-8">

<meta name="description" content="O banco de dados aberto do futebol — campeonatos, tabelas, jogos, gols e elencos, mantido pelos seus leitores.">
<!-- This one document answers at every route, so the URL it arrives under is
     not where it lives: without a base, ./boot.js is /boot.js at /games and
     nothing on the page runs at all. Links are composed absolute and are
     unaffected. -->
<base href="/shell/">
<title>Loading…</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e3efca">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#23260f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="golaberto">
<meta property="og:type" content="website">
<meta property="og:title" content="golaberto">
<meta property="og:description" content="O banco de dados aberto do futebol — campeonatos, tabelas, jogos, gols e elencos, mantido pelos seus leitores.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="golaberto">
<meta name="twitter:description" content="O banco de dados aberto do futebol — campeonatos, tabelas, jogos, gols e elencos, mantido pelos seus leitores.">
<link rel="stylesheet" href="./shell.css">
<link rel="stylesheet" href="./design.css">
<link rel="stylesheet" href="../shell/shared/chrome.css">
<link rel="preload" href="./shell.json" as="fetch" crossorigin>
<link rel="modulepreload" href="/omnishell/interpreter/shell.js">
<link rel="modulepreload" href="/omnishell/interpreter/chrome.js">
<link rel="modulepreload" href="/omnishell/interpreter/screen.js">
<link rel="modulepreload" href="/omnishell/interpreter/fragment.js">
<link rel="modulepreload" href="/omnishell/interpreter/data-sync.js">
<link rel="modulepreload" href="/omnishell/interpreter/validate.js">
<link rel="modulepreload" href="/omnishell/interpreter/render.js">
<link rel="modulepreload" href="/omnishell/interpreter/release-plan.js">
<link rel="modulepreload" href="/omnishell/interpreter/release-assets.js">
<link rel="modulepreload" href="/omnishell/interpreter/preloads.js">
<link rel="modulepreload" href="/omnishell/interpreter/hatch.js">
<link rel="modulepreload" href="/omnishell/interpreter/hatch-worker.js">
<link rel="modulepreload" href="/omnishell/interpreter/jessie.js">
<link rel="modulepreload" href="/omnishell/interpreter/vendor/mecha-client.js">
<link rel="modulepreload" href="/omnishell/interpreter/vendor/messages.js">
<script type="speculationrules">
{
  "prefetch": [
    {
      "source": "document",
      "where": {
        "and": [
          { "href_matches": "/*" },
          { "not": { "href_matches": "/auth/*" } },
          { "not": { "href_matches": "/crud/*" } },
          { "not": { "href_matches": "/electric/*" } },
          { "not": { "href_matches": "/srv/*" } },
          { "not": { "href_matches": "/shell/*" } }
        ]
      },
      "eagerness": "moderate"
    }
  ]
}
</script>
</head>
<body>
<main id="app"></main>
<script type="module" src="./boot.js"></script>
</body>
</html>
