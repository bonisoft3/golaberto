<!-- generated by pronto from program.cue — do not edit -->
<section class="screen" data-screen="arbitro">
<header class="masthead">
  <a class="wordmark" data-route="principal" aria-label="{msg.brand}"><b data-text="{msg.brand_gol}"></b><span data-text="{msg.brand_aberto}"></span></a>
  <nav class="langs" aria-label="{msg.lang_label}">
    <a data-route="arbitro" data-param-id="{param.id}" data-locale="pt-BR" data-locale-current="page" lang="pt-BR"><span class="long" data-text="{msg.lang_pt}"></span><span class="short" data-text="{msg.lang_pt_short}"></span></a>
    <a data-route="arbitro" data-param-id="{param.id}" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="arbitro" data-param-id="{param.id}" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="arbitro" data-param-id="{param.id}" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="arbitro" data-param-id="{param.id}" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="arbitro" data-param-id="{param.id}" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<div data-live="referee" data-filter="id=eq.{param.id}" data-exit-motion="none" data-empty="{msg.referee_gone}">
  <template data-item>
    <article class="venue">
      <h1 class="band" data-text="{name}"></h1>
      <div class="page">
        <div class="content">
          <dl class="game-facts">
            <dt data-text="{msg.col_from}"></dt><dd data-text="{location}"></dd>
          </dl>
          <section class="venue-games">
            <h2 data-text="{msg.referee_games}"></h2>
<ol class="games" data-live="game_card" data-filter="referee_id=eq.{id}" data-order="day.desc,kickoff.desc" data-empty="{msg.referee_no_games}">
  <template data-item>
    <li><a class="game-row" data-route="jogo" data-param-id="{id}" data-played="{played}">
      <span class="when"><span class="day" data-text="{day_display}"></span> <span class="hour" data-text="{kickoff_local}"></span></span>
      <span class="where" data-text="{championship_name}"></span>
      <span class="home" data-text="{home_name}"></span>
      <span class="score"><b data-text="{home_score}"></b><i>x</i><b data-text="{away_score}"></b></span>
      <span class="away" data-text="{away_name}"></span>
    </a></li>
  </template>
</ol>
          </section>
        </div>
        <aside class="side">
          <p><a data-route="arbitros" data-text="{msg.back_referees}"></a></p>
          <p data-text="{msg.about}"></p>
        </aside>
      </div>
    </article>
  </template>
</div>
</section>
