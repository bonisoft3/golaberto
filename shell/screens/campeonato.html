<div data-live="championship" data-filter="slug=eq.{param.slug}" data-exit-motion="none" data-empty="{msg.championship_gone}">

    <article class="championship">

      <div class="page page-with-local-nav">

  <div class="local-nav-stack">
<nav class="local-navigation" aria-label="{msg.local_championship}">

  <div class="local-links">
<a data-route="campeonato" data-param-slug="{param.slug}" aria-current="page" data-text="{msg.team_table}"></a>
<a data-route="arquivo-campeonato" data-param-slug="{param.slug}" data-text="{msg.games_title}"></a>
<a data-route="campeonato-jogadores" data-param-slug="{param.slug}" data-text="{msg.players_title}"></a>
<a data-route="publico" data-param-slug="{param.slug}" data-text="{msg.archive_attendance_title}"></a>
  </div>
</nav>
<nav class="local-navigation local-stages" aria-label="{msg.phases_label}">

    <template data-item><a data-route="campeonato" data-param-slug="{param.slug}" data-route-fragment="fase-{id}" data-text="{name}"></a></template>
  </div>
</nav>
    <p class="local-back"><a data-route="campeonatos" data-text="{msg.back_catalog}"></a></p>
    <p class="local-about" data-text="{msg.about}"></p>
  </div>
</aside>
        <div class="content">

                <h2 data-text="{name}"></h2>

	                            <th scope="col" class="form wide" data-text="{msg.col_form}"></th>
                          </tr></thead>

      <span class="visually-hidden" data-text="{msg.team_match_preview_next}: "></span><span class="team-match-preview-date"><span class="team-match-preview-day" data-text="{reader_day}" data-text-format="date"></span> <span class="team-match-preview-time" data-text="{kickoff}" data-text-format="time"></span></span>

    </a></template>
</div>
</div></td>
	                                <td class="num pts" data-text="{points}"></td>
	                                <td class="num" data-text="{played}"></td>
	                                <td class="num wide" data-text="{wins}"></td>
	                                <td class="num wide" data-text="{draws}"></td>
	                                <td class="num wide" data-text="{losses}"></td>
	                                <td class="num wide" data-text="{goals_for}"></td>
	                                <td class="num wide" data-text="{goals_against}"></td>
	                                <td class="num" data-text="{goal_diff}"></td>
	                                <td class="form wide"><i data-result="{form1}" title="{msg[form1]}"></i><i data-result="{form2}" title="{msg[form2]}"></i><i data-result="{form3}" title="{msg[form3]}"></i><i data-result="{form4}" title="{msg[form4]}"></i><i data-result="{form5}" title="{msg[form5]}"></i></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                      <ul class="zones" data-live="zone" data-filter="group_id=eq.{id}" data-order="first.asc,last.asc" data-empty="">

                        </template>

                    </section>
                  </template>
                </div>

              </section>
