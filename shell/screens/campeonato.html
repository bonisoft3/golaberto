<!-- generated by pronto from program.cue — do not edit -->
<section class="screen" data-screen="campeonato">
<header class="masthead">
  <a class="wordmark" data-route="principal" aria-label="{msg.brand}"><b data-text="{msg.brand_gol}"></b><span data-text="{msg.brand_aberto}"></span></a>
  <nav class="langs" aria-label="{msg.lang_label}">
    <a data-route="campeonato" data-param-id="{param.id}" data-locale="pt-BR" data-locale-current="page" lang="pt-BR"><span class="long" data-text="{msg.lang_pt}"></span><span class="short" data-text="{msg.lang_pt_short}"></span></a>
    <a data-route="campeonato" data-param-id="{param.id}" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="campeonato" data-param-id="{param.id}" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="campeonato" data-param-id="{param.id}" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="campeonato" data-param-id="{param.id}" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="campeonato" data-param-id="{param.id}" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<div data-live="championship" data-filter="id=eq.{param.id}" data-exit-motion="none" data-empty="{msg.championship_gone}">
  <template data-item>
    <article class="championship">
      <h1 class="band" data-text="{full_name}"></h1>
      <div class="page">
        <div class="content">
          <p class="facts">
            <span class="chip"><span data-text="{msg[region]}"></span></span>
            <span class="chip" data-live="category" data-filter="id=eq.{category_id}" data-empty="{msg.professional}"><template data-item><span data-text="{name}"></span></template></span>
            <span class="points"><span data-text="{msg.win}"></span> <b data-text="{point_win}"></b> · <span data-text="{msg.draw}"></span> <b data-text="{point_draw}"></b> · <span data-text="{msg.loss}"></span> <b data-text="{point_loss}"></b></span>
          </p>
          <nav class="phase-chips" aria-label="{msg.phases_label}" data-live="phase" data-filter="championship_id=eq.{id}" data-order="position.asc" data-empty="{msg.no_phases}">
            <template data-item><a class="chip" href="#fase-{id}" data-text="{name}"></a></template>
          </nav>
          <div class="phases" data-live="phase" data-filter="championship_id=eq.{id}" data-order="position.asc" data-empty="">
            <template data-item>
              <section class="phase" id="fase-{id}">
                <h2 data-text="{name}"></h2>
                <div class="groups" data-live="stage_group" data-filter="phase_id=eq.{id}" data-order="position.asc,name.asc" data-empty="{msg.no_groups}">
                  <template data-item>
                    <section class="group">
                      <div class="group-head">
                        <h3 data-text="{name}"></h3>
                        <div data-live="team_chance" data-filter="group_id=eq.{id}&rank=eq.1" data-empty=""><template data-item><a class="btn-quiet chances-link" data-route="chances" data-param-id="{group_id}" data-text="{msg.chances_link}"></a></template></div>
                      </div>
                      <div class="table-wrap">
                        <table class="grid standings">
                          <thead><tr>
	                            <th scope="col" class="pos"><abbr title="{msg.col_position_long}" data-text="{msg.col_position}"></abbr></th>
	                            <th scope="col" class="name" data-text="{msg.col_team}"></th>
	                            <th scope="col" class="num pts"><abbr title="{msg.col_points_long}" data-text="{msg.col_points}"></abbr></th>
	                            <th scope="col" class="num"><abbr title="{msg.col_played_long}" data-text="{msg.col_played}"></abbr></th>
	                            <th scope="col" class="num wide"><abbr title="{msg.col_wins_long}" data-text="{msg.col_wins}"></abbr></th>
	                            <th scope="col" class="num wide"><abbr title="{msg.col_draws_long}" data-text="{msg.col_draws}"></abbr></th>
	                            <th scope="col" class="num wide"><abbr title="{msg.col_losses_long}" data-text="{msg.col_losses}"></abbr></th>
	                            <th scope="col" class="num wide"><abbr title="{msg.col_for_long}" data-text="{msg.col_for}"></abbr></th>
	                            <th scope="col" class="num wide"><abbr title="{msg.col_against_long}" data-text="{msg.col_against}"></abbr></th>
	                            <th scope="col" class="num"><abbr title="{msg.col_diff_long}" data-text="{msg.col_diff}"></abbr></th>
	                            <th scope="col" class="form wide" data-text="{msg.col_form}"></th>
                          </tr></thead>
                          <tbody data-live="standing" data-filter="group_id=eq.{id}" data-order="position.asc" data-empty="{msg.no_teams}">
                            <template data-item>
                              <tr data-zone="{zone}">
	                                <td class="pos" data-text="{position}"></td>
	                                <td class="name"><a data-route="equipe" data-param-id="{team_id}" data-text="{team_name}"></a></td>
	                                <td class="num pts" data-text="{points}"></td>
	                                <td class="num" data-text="{played}"></td>
	                                <td class="num wide" data-text="{wins}"></td>
	                                <td class="num wide" data-text="{draws}"></td>
	                                <td class="num wide" data-text="{losses}"></td>
	                                <td class="num wide" data-text="{goals_for}"></td>
	                                <td class="num wide" data-text="{goals_against}"></td>
	                                <td class="num" data-text="{goal_diff}"></td>
	                                <td class="form wide"><i data-result="{form1}" title="{msg[form1]}"></i><i data-result="{form2}" title="{msg[form2]}"></i><i data-result="{form3}" title="{msg[form3]}"></i><i data-result="{form4}" title="{msg[form4]}"></i><i data-result="{form5}" title="{msg[form5]}"></i></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                      <ul class="zones" data-live="zone" data-filter="group_id=eq.{id}" data-order="first.asc,last.asc" data-empty="">
                        <template data-item>
                          <li data-zone="{color}"><i aria-hidden="true"></i><span data-text="{name}"></span> <span class="range" data-text="{first}–{last}"></span></li>
                        </template>
                      </ul>
                    </section>
                  </template>
                </div>
                <div class="rounds" data-live="phase_round" data-filter="phase_id=eq.{id}" data-empty="">
                  <template data-item>
                    <div class="round-pair">
                      <section class="round">
                        <h3><span data-text="{msg.round}"></span> <span data-text="{current}"></span></h3>
<ol class="games" data-live="game_card" data-filter="phase_id=eq.{phase_id}&round=eq.{current}" data-order="day.asc,kickoff.asc" data-empty="{msg.round_empty}">
  <template data-item>
    <li><a class="game-row" data-route="jogo" data-param-id="{id}" data-played="{played}">
      <span class="when"><span class="day" data-text="{day_display}"></span> <span class="hour" data-text="{kickoff_local}"></span></span>
      <span class="home" data-text="{home_name}"></span>
      <span class="score"><b data-text="{home_score}"></b><i>x</i><b data-text="{away_score}"></b></span>
      <span class="away" data-text="{away_name}"></span>
    </a></li>
  </template>
</ol>
                      </section>
                      <div class="round-next" data-live="phase_round" data-filter="id=eq.{id}&next=not.is.null" data-empty="">
                        <template data-item>
                          <section class="round">
                            <h3><span data-text="{msg.round}"></span> <span data-text="{next}"></span></h3>
<ol class="games" data-live="game_card" data-filter="phase_id=eq.{phase_id}&round=eq.{next}" data-order="day.asc,kickoff.asc" data-empty="{msg.round_empty}">
  <template data-item>
    <li><a class="game-row" data-route="jogo" data-param-id="{id}" data-played="{played}">
      <span class="when"><span class="day" data-text="{day_display}"></span> <span class="hour" data-text="{kickoff_local}"></span></span>
      <span class="home" data-text="{home_name}"></span>
      <span class="score"><b data-text="{home_score}"></b><i>x</i><b data-text="{away_score}"></b></span>
      <span class="away" data-text="{away_name}"></span>
    </a></li>
  </template>
</ol>
                          </section>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </section>
            </template>
          </div>
        </div>
        <aside class="side">
          <p><a data-route="campeonatos" data-text="{msg.back_catalog}"></a></p>
          <p data-text="{msg.about}"></p>
        </aside>
      </div>
    </article>
  </template>
</div>
</section>
