<!-- generated by pronto from program.cue — do not edit -->
<section class="screen" data-screen="campeonatos">
<header class="masthead">
  <a class="wordmark" data-route="principal" aria-label="{msg.brand}"><b data-text="{msg.brand_gol}"></b><span data-text="{msg.brand_aberto}"></span></a>
  <nav class="langs" aria-label="{msg.lang_label}">
    <a data-route="campeonatos" data-locale="pt-BR" data-locale-current="page" lang="pt-BR"><span class="long" data-text="{msg.lang_pt}"></span><span class="short" data-text="{msg.lang_pt_short}"></span></a>
    <a data-route="campeonatos" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="campeonatos" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="campeonatos" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="campeonatos" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="campeonatos" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<h1 class="band" data-text="{msg.catalog_title}"></h1>
<div class="page">
  <div class="content" data-live="catalog_filter" data-filter="id=eq.catalog" data-machine='{"field":"state","initial":"browsing","context":{"q":"","region":""},"states":{"browsing":{"on":{"input@catalog-q":{"assign":{"q":{"type":"event","params":{"field":"value"}}}},"change@catalog-region":{"assign":{"region":{"type":"event","params":{"field":"value"}}}}}}}}'>
    <template data-item>
      <div class="catalog">
        <div class="filters" role="search">
          <label class="field grow" for="catalog-q"><span data-text="{msg.search_label}"></span>
            <input id="catalog-q" type="search" value="{q}" placeholder="{msg.search_placeholder}" maxlength="80" autocomplete="off">
          </label>
          <label class="field" for="catalog-region"><span data-text="{msg.region_label}"></span>
            <select id="catalog-region" data-value="{region}">
              <option value="" data-text="{msg.region_all}"></option>
              <option value="world" data-text="{msg.world}"></option>
              <option value="continental" data-text="{msg.continental}"></option>
              <option value="national" data-text="{msg.national}"></option>
            </select>
          </label>
        </div>
        <table class="grid catalog-table">
          <thead><tr>
            <th scope="col" data-text="{msg.col_name}"></th>
            <th scope="col" class="narrow" data-text="{msg.col_region}"></th>
            <th scope="col" class="narrow" data-text="{msg.col_category}"></th>
          </tr></thead>
          <tbody data-live="championship" data-filter="full_name=ilike.*{q}*&region=like.*{region}*" data-order="region_name.asc,name.asc,begins.desc" data-empty="{msg.catalog_empty}">
            <template data-item>
              <tr>
                <td><a data-route="campeonato" data-param-id="{id}" data-text="{full_name}"></a></td>
                <td class="narrow" data-text="{msg[region]}"></td>
                <td class="narrow"><span data-live="category" data-filter="id=eq.{category_id}" data-empty="{msg.professional}"><template data-item><span data-text="{name}"></span></template></span></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </div>
  <aside class="side"><p data-text="{msg.about}"></p></aside>
</div>
</section>
