<!-- generated by pronto from program.cue — do not edit -->
<section class="screen" data-screen="editar-estadio">
<header class="masthead">
  <a class="wordmark" data-route="principal" aria-label="{msg.brand}"><b data-text="{msg.brand_gol}"></b><span data-text="{msg.brand_aberto}"></span></a>
  <a class="editing-management-link" data-route="gerenciar" data-text="{msg.manage_home}"></a>
  <nav class="langs" aria-label="{msg.lang_label}">
    <a data-route="editar-estadio" data-param-slug="{param.slug}" data-locale="pt-BR" data-locale-current="page" lang="pt-BR"><span class="long" data-text="{msg.lang_pt}"></span><span class="short" data-text="{msg.lang_pt_short}"></span></a>
    <a data-route="editar-estadio" data-param-slug="{param.slug}" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="editar-estadio" data-param-slug="{param.slug}" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="editar-estadio" data-param-slug="{param.slug}" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="editar-estadio" data-param-slug="{param.slug}" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="editar-estadio" data-param-slug="{param.slug}" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<h1 class="band" data-text="{msg.manage_editar_estadio}"></h1>
<div class="page"><div class="content">
<div data-live="editor" data-filter="limit=1" data-empty="{msg.manage_editor_required}"><template data-item><div class="editing-workspace"><p class="editing-success" role="status" data-text="{msg.manage_saved}"></p>
<div data-live="stadium" data-select="*" data-filter="slug=eq.{param.slug}&limit=1" data-empty="{msg.manage_record_gone}"><template data-item><div class="editing-record">
  <form class="edit" data-form="estadio-update" data-entity="stadium" data-action="update">
    <fieldset class="edit-sec"><legend data-text="{msg.edit_facts}"></legend><div class="fields">
      
      
      <label class="field wide"><span data-text="{msg.manage_name}"></span>
<input name="name" value="" type="text" data-value="{name}" data-value-adapter="editing-text" required maxlength="80">
</label><label class="field wide"><span data-text="{msg.manage_full_name}"></span>
<input name="full_name" value="" type="text" data-value="{full_name}" data-value-adapter="editing-text" maxlength="160">
</label><label class="field wide"><span data-text="{msg.manage_city}"></span>
<input name="city" value="" type="text" data-value="{city}" data-value-adapter="editing-text" maxlength="80">
</label><label class="field wide"><span data-text="{msg.manage_country}"></span>
<input name="country" value="" type="text" data-value="{country}" data-value-adapter="editing-text" maxlength="60">
</label>
      
    </div></fieldset>
    <p class="invalid" role="alert" hidden data-text="{msg.manage_invalid}"></p>
<p class="store-error" role="alert" hidden data-text="{msg.manage_refused}"></p><div class="buttons"><button class="btn" type="submit" data-text="{msg.edit_save}"></button><a class="btn-quiet" data-route="gerenciar" data-text="{msg.manage_home}"></a></div>
  </form>
  
  
  
  
  
  
  
  <details class="edit-sec editing-danger"><summary data-text="{msg.manage_remove}"></summary>
  <p class="hint" data-text="{msg.manage_delete_hint}"></p>
  <form data-form="estadio-delete" data-entity="stadium" data-action="delete">
    <label class="field"><input type="checkbox" required><span data-text="{msg.manage_confirm_delete}"></span></label>
    <p class="invalid" role="alert" hidden data-text="{msg.manage_invalid}"></p>
<p class="store-error" role="alert" hidden data-text="{msg.manage_refused}"></p><button class="btn-quiet" type="submit" data-text="{msg.manage_remove}"></button>
  </form>
</details>
</div></template></div>
</div></template></div>
</div><aside class="side"><p data-text="{msg.about}"></p></aside></div>
</section>
