<section class="screen" data-screen="editar-jogador">
<header class="masthead">
  <a class="wordmark" data-route="principal" aria-label="{msg.brand}"><b data-text="{msg.brand_gol}"></b><span data-text="{msg.brand_aberto}"></span></a>
  <a class="editing-management-link" data-route="gerenciar" data-text="{msg.manage_home}"></a>
  <nav class="langs" aria-label="{msg.lang_label}">
    <a data-route="editar-jogador" data-param-slug="{param.slug}" data-locale="pt-BR" data-locale-current="page" lang="pt-BR"><span class="long" data-text="{msg.lang_pt}"></span><span class="short" data-text="{msg.lang_pt_short}"></span></a>
    <a data-route="editar-jogador" data-param-slug="{param.slug}" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="editar-jogador" data-param-slug="{param.slug}" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="editar-jogador" data-param-slug="{param.slug}" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="editar-jogador" data-param-slug="{param.slug}" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="editar-jogador" data-param-slug="{param.slug}" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<h1 class="band" data-text="{msg.manage_editar_jogador}"></h1>
<div class="page"><div class="content">
<div data-live="editor" data-filter="limit=1" data-empty="{msg.manage_editor_required}"><template data-item><div class="editing-workspace"><p class="editing-success" role="status" data-text="{msg.manage_saved}"></p>
<div data-live="player" data-select="*" data-filter="slug=eq.{param.slug}&limit=1" data-empty="{msg.manage_record_gone}"><template data-item><div class="editing-record">
  <form class="edit" data-form="jogador-update" data-entity="player" data-action="update">
    <fieldset class="edit-sec"><legend data-text="{msg.edit_facts}"></legend><div class="fields">
      
      
      <label class="field wide"><span data-text="{msg.manage_name}"></span>
<input name="name" value="" type="text" data-value="{name}" data-value-adapter="editing-text" required maxlength="60">
</label><label class="field wide"><span data-text="{msg.manage_full_name}"></span>
<input name="full_name" value="" type="text" data-value="{full_name}" data-value-adapter="editing-text" maxlength="160">
</label><label class="field wide"><span data-text="{msg.manage_birth}"></span>
<input name="birth" value="" type="date" data-value="{birth}" data-value-adapter="editing-text">
</label><label class="field wide"><span data-text="{msg.manage_country}"></span>
<input name="country" value="" type="text" data-value="{country}" data-value-adapter="editing-text" maxlength="60">
</label><label class="field wide"><span data-text="{msg.manage_height}"></span>
<input name="height" value="" type="number" data-value="{height}" data-value-adapter="editing-integer" min="100" max="230" step="1">
</label><label class="field wide"><span data-text="{msg.manage_position}"></span>
<select name="position" data-value-adapter="editing-text" data-value="{position}"><option value="" data-text="{msg.edit_unknown}"></option><option value="g" data-text="{msg.player_position_g}"></option><option value="dr" data-text="{msg.player_position_dr}"></option><option value="dc" data-text="{msg.player_position_dc}"></option><option value="dl" data-text="{msg.player_position_dl}"></option><option value="dm" data-text="{msg.player_position_dm}"></option><option value="cm" data-text="{msg.player_position_cm}"></option><option value="am" data-text="{msg.player_position_am}"></option><option value="fw" data-text="{msg.player_position_fw}"></option></select>
</label>
      
    </div></fieldset>
    <p class="invalid" role="alert" hidden data-text="{msg.manage_invalid}"></p>
<p class="store-error" role="alert" hidden data-text="{msg.manage_refused}"></p><div class="buttons"><button class="btn" type="submit" data-text="{msg.edit_save}"></button><a class="btn-quiet" data-route="gerenciar" data-text="{msg.manage_home}"></a></div>
  </form>
  
  
  
  
  
  <a class="btn-quiet" data-route="inscricoes-jogador" data-param-slug="{param.slug}" data-text="{msg.manage_registrations}"></a><details class="edit-sec editing-danger"><summary data-text="{msg.manage_merge}"></summary>
 <p class="hint" data-text="{msg.manage_merge_hint}"></p>
 <form class="edit" data-form="jogador-merge" data-entity="player_merge" data-action="create">
  <input type="hidden" name="target_player_id" data-value="{id}">
  <div class="field wide editing-choice" data-live="editing_choice" data-filter="id=eq.merge-{id}" data-machine='{"field":"state","initial":"choosing","context":{"q":"","q_key":"","selected_id":null,"excluded_id":"{id}"},"states":{"choosing":{"on":{"input":{"guard":{"type":"editing-choice-event","params":{"suffix":"-q"}},"assign":{"q":{"type":"event","params":{"field":"value"}},"q_key":{"type":"search-key"}}},"change":{"guard":{"type":"editing-choice-event","params":{"suffix":"-pick"}},"assign":{"selected_id":{"type":"blank-null"}}},"reset":{"assign":{"q":"","q_key":"","selected_id":null}}}}}}' data-empty-row='{"id":"merge-{id}","state":"choosing","q":"","q_key":"","selected_id":null,"excluded_id":"{id}"}'>
  <label for="{id}-q" data-text="{msg.choice_search}"></label><input id="{id}-q" type="search" maxlength="80" value="{q}" autocomplete="off">
  <label for="{id}-pick" data-text="{msg.manage_source_player}"></label>
  <select id="{id}-pick" name="source_player_id" data-value="{selected_id}" data-value-adapter="editing-uuid" required>
    <option value="" data-text="{msg.edit_unknown}"></option>
    <optgroup data-live="player" data-select="*" data-filter="id=in.({selected_id})&limit=1" data-empty=""><template data-item><option value="{id}" data-text="{name}"></option></template></optgroup>
    <optgroup data-live="player_directory" data-select="*" data-filter="search_key=like.*{q_key}*&limit=40&id=neq.{excluded_id}" data-order="name.asc,id.asc" data-empty=""><template data-item><option value="{id}" data-text="{name}"></option></template></optgroup>
  </select><p class="hint" data-text="{msg.manage_choice_hint}"></p>
</div>
  <label class="field"><input type="checkbox" required><span data-text="{msg.manage_confirm_merge}"></span></label>
  <p class="invalid" role="alert" hidden data-text="{msg.manage_invalid}"></p>
<p class="store-error" role="alert" hidden data-text="{msg.manage_refused}"></p><button class="btn" type="submit" data-text="{msg.manage_merge}"></button>
 </form>
</details>
  
  <details class="edit-sec editing-danger"><summary data-text="{msg.manage_remove}"></summary>
  <p class="hint" data-text="{msg.manage_delete_hint}"></p>
  <form data-form="jogador-delete" data-entity="player" data-action="delete">
    <label class="field"><input type="checkbox" required><span data-text="{msg.manage_confirm_delete}"></span></label>
    <p class="invalid" role="alert" hidden data-text="{msg.manage_invalid}"></p>
<p class="store-error" role="alert" hidden data-text="{msg.manage_refused}"></p><button class="btn-quiet" type="submit" data-text="{msg.manage_remove}"></button>
  </form>
</details>
</div></template></div>
</div></template></div>
</div><aside class="side"><p data-text="{msg.about}"></p></aside></div>
</section>
