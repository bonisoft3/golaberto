<!-- generated by pronto from program.cue — do not edit -->
<section class="screen" data-screen="equipes">
<header class="masthead">
  <a class="wordmark" data-route="principal" aria-label="{msg.brand}"><b data-text="{msg.brand_gol}"></b><span data-text="{msg.brand_aberto}"></span></a>
  <nav class="langs" aria-label="{msg.lang_label}">
    <a data-route="equipes" data-locale="pt-BR" data-locale-current="page" lang="pt-BR"><span class="long" data-text="{msg.lang_pt}"></span><span class="short" data-text="{msg.lang_pt_short}"></span></a>
    <a data-route="equipes" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="equipes" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="equipes" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="equipes" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="equipes" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<h1 class="band" data-text="{msg.teams_title}"></h1>
<div class="page">
  <div class="content" data-live="directory_filter" data-filter="id=eq.teams" data-machine='{"field":"state","initial":"browsing","context":{"q":""},"states":{"browsing":{"on":{"input@teams-q":{"assign":{"q":{"type":"event","params":{"field":"value"}}}}}}}}'>
    <template data-item>
      <div class="catalog">
        <div class="filters" role="search">
          <label class="field grow" for="teams-q"><span data-text="{msg.search_label}"></span>
            <input id="teams-q" type="search" value="{q}" placeholder="{msg.teams_placeholder}" maxlength="80" autocomplete="off">
          </label>
        </div>
        <table class="grid catalog-table">
          <thead><tr>
            <th scope="col" data-text="{msg.col_team}"></th>
            <th scope="col" class="narrow" data-text="{msg.col_city}"></th>
            <th scope="col" class="narrow drop" data-text="{msg.col_country}"></th>
          </tr></thead>
          <tbody data-live="team" data-filter="name=ilike.*{q}*" data-order="name.asc" data-empty="{msg.teams_empty}">
            <template data-item>
              <tr>
                <td><a data-route="equipe" data-param-id="{id}" data-text="{name}"></a></td>
                <td class="narrow" data-text="{city}"></td>
                <td class="narrow drop" data-text="{country}"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </div>
  <aside class="side"><p data-text="{msg.about}"></p></aside>
</div>
</section>
