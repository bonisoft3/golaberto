<section class="screen" data-screen="jogador">
<header class="masthead">

    <a data-route="jogador" data-param-slug="{param.slug}" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="jogador" data-param-slug="{param.slug}" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="jogador" data-param-slug="{param.slug}" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="jogador" data-param-slug="{param.slug}" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="jogador" data-param-slug="{param.slug}" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<div data-live="player" data-filter="slug=eq.{param.slug}" data-exit-motion="none" data-empty="{msg.player_gone}">
  <template data-item>
    <article class="player">
      <h1 class="band" data-text="{name}"></h1>
      <div class="page">
        <div class="content">
          <dl class="game-facts">
            <dt data-text="{msg.player_position}"></dt><dd data-text="{position}"></dd>
            <dt data-text="{msg.player_rating}"></dt><dd class="rating" data-live="player_rating" data-filter="id=eq.{id}" data-empty=""><template data-item><abbr title="{msg.player_rating_long}" data-text="{rating}" data-text-format="number"></abbr></template></dd>
            <dt data-text="{msg.team_country}"></dt><dd><span class="archive-icon" data-text="{country}" data-text-format="country-flag"></span><span data-text="{country}|{msg.geography_names}" data-text-format="geography-label"></span></dd>
          </dl>
          <section class="seasons">
            <h2 data-text="{msg.player_seasons}"></h2>
<div class="paged-read" data-live="archive_page" data-filter="id=eq.player-seasons-{id}" data-machine='{"field":"state","initial":"browsing","context":{"owner_id":"{id}","offset":0,"next_offset":40,"page":1},"states":{"browsing":{"on":{"click@player-seasons-previous":{"assign":{"offset":{"type":"page-value","params":{"step":-40,"field":"offset"}},"next_offset":{"type":"page-value","params":{"step":-40,"field":"next_offset"}},"page":{"type":"page-value","params":{"step":-40,"field":"page"}}}},"click@player-seasons-next":{"assign":{"offset":{"type":"page-value","params":{"step":40,"field":"offset"}},"next_offset":{"type":"page-value","params":{"step":40,"field":"next_offset"}},"page":{"type":"page-value","params":{"step":40,"field":"page"}}}}}}}}' data-empty-row='{"id":"player-seasons-{id}","owner_id":"{id}","offset":0,"next_offset":40,"page":1,"state":"browsing"}'>
  <div class="page-window">

            <table class="grid season-table">
              <thead><tr><th scope="col" data-text="{msg.col_championship}"></th><th scope="col" data-text="{msg.col_team}"></th><th scope="col" class="num"><abbr title="{msg.col_played_long}" data-text="{msg.col_played}"></abbr></th><th scope="col" class="num"><abbr title="{msg.col_started_long}" data-text="{msg.col_started}"></abbr></th><th scope="col" class="num"><abbr title="{msg.col_came_on_long}" data-text="{msg.col_came_on}"></abbr></th><th scope="col" class="num"><abbr title="{msg.col_minutes_long}" data-text="{msg.col_minutes}"></abbr></th><th scope="col" class="num"><abbr title="{msg.col_goals_long}" data-text="{msg.col_goals}"></abbr></th><th scope="col" class="num"><abbr title="{msg.col_penalties_long}" data-text="{msg.col_penalties}"></abbr></th><th scope="col" class="num"><abbr title="{msg.col_yellow_long}" data-text="{msg.col_yellow}"></abbr></th><th scope="col" class="num"><abbr title="{msg.col_red_long}" data-text="{msg.col_red}"></abbr></th></tr></thead>
              <tbody data-live="player_stat" data-select="*,team(slug),championship(slug)" data-filter="player_id=eq.{owner_id}&offset={offset}&limit=40" data-order="championship_name.asc,team_name.asc" data-empty="{msg.player_no_seasons}">
                <template data-item>
                  <tr><td><a data-route="equipe-campeonato" data-param-slug="{team.slug}" data-param-championship="{championship.slug}"><span class="archive-icon" data-text="{championship_name}" data-text-format="country-flag"></span><span data-text="{championship_name}|{msg.geography_names}" data-text-format="geography-label"></span></a></td><td><a data-route="equipe" data-param-slug="{team.slug}"><span class="archive-icon" data-text="{team_id}|{team_name}" data-text-format="team-badge"></span><span data-text="{team_name}"></span></a></td><td class="num" data-text="{played}"></td><td class="num" data-text="{started}"></td><td class="num" data-text="{came_on}"></td><td class="num" data-text="{minutes}"></td><td class="num" data-text="{goals}"></td><td class="num" data-text="{penalties}"></td><td class="num" data-text="{yellow}"></td><td class="num" data-text="{red}"></td></tr>
                </template>
              </tbody>
            </table>
<nav class="archive-pager" data-page-offset="{offset}" aria-label="{msg.archive_pages}">
  <button id="player-seasons-previous" type="button" class="btn-quiet page-previous" data-text="{msg.page_previous}"></button>
  <span class="page-status"><span data-text="{msg.page_label}"></span> <b data-text="{page}" data-text-format="number"></b></span>
  <span data-live="player_stat" data-filter="player_id=eq.{owner_id}&amp;offset={next_offset}&amp;limit=1" data-order='championship_name.asc,team_name.asc' data-empty=""><template data-item><i data-next-page hidden></i></template></span>
  <button id="player-seasons-next" type="button" class="btn-quiet page-next" data-text="{msg.page_next}"></button>
</nav>
  </div>
</div>
          </section>
          <section class="appearances">
            <h2 data-text="{msg.player_games}"></h2>
<div class="paged-read" data-live="archive_page" data-filter="id=eq.player-appearances-{id}" data-machine='{"field":"state","initial":"browsing","context":{"owner_id":"{id}","offset":0,"next_offset":40,"page":1},"states":{"browsing":{"on":{"click@player-appearances-previous":{"assign":{"offset":{"type":"page-value","params":{"step":-40,"field":"offset"}},"next_offset":{"type":"page-value","params":{"step":-40,"field":"next_offset"}},"page":{"type":"page-value","params":{"step":-40,"field":"page"}}}},"click@player-appearances-next":{"assign":{"offset":{"type":"page-value","params":{"step":40,"field":"offset"}},"next_offset":{"type":"page-value","params":{"step":40,"field":"next_offset"}},"page":{"type":"page-value","params":{"step":40,"field":"page"}}}}}}}}' data-empty-row='{"id":"player-appearances-{id}","owner_id":"{id}","offset":0,"next_offset":40,"page":1,"state":"browsing"}'>
  <div class="page-window">

            <ol class="games player-games" data-live="player_game" data-filter="player_id=eq.{owner_id}&offset={offset}&limit=40" data-order="day.desc" data-empty="{msg.player_no_games}">
              <template data-item>
                <li data-bench="{bench}" data-yellow="{yellow}" data-red="{red}">
                  <span data-live="game_card" data-select="*,game:id(slug),stadium(slug),referee(slug),championship(show_country,slug),home:home_id(country,slug),away:away_id(country,slug)" data-filter="id=eq.{game_id}" data-empty=""><template data-item>
                    <a class="game-row" data-show-country="{championship.show_country}" data-route="jogo" data-param-slug="{game.slug}" data-played="{played}">
                      <span class="when"><span class="day" data-text="{day_display}"></span></span>
                      <span class="where" data-text="{championship_name}|{msg.geography_names}" data-text-format="geography-label"></span>
                      <span class="home"><span class="team-name" data-text="{home_name}"></span><span class="team-icons"><span class="archive-icon team-flag" data-text="{championship.show_country}|{home.country}" data-text-format="country-flag"></span><span class="archive-icon team-badge" data-text="{home_id}|{home_name}" data-text-format="team-badge"></span></span></span>
                      <span class="score"><b data-text="{home_score}"></b><i>x</i><b data-text="{away_score}"></b></span>
                      <span class="away"><span class="team-icons"><span class="archive-icon team-badge" data-text="{away_id}|{away_name}" data-text-format="team-badge"></span><span class="archive-icon team-flag" data-text="{championship.show_country}|{away.country}" data-text-format="country-flag"></span></span><span class="team-name" data-text="{away_name}"></span></span>
                    </a>
                  </template></span>
                  <span class="minutes"><span data-text="{on_minute}"></span>–<span data-text="{off_minute}"></span></span>
                  <span class="cards"><i class="yellow" title="{msg.card_yellow}"></i><i class="red" title="{msg.card_red}"></i></span>
                </li>
              </template>
            </ol>
<nav class="archive-pager" data-page-offset="{offset}" aria-label="{msg.archive_pages}">
  <button id="player-appearances-previous" type="button" class="btn-quiet page-previous" data-text="{msg.page_previous}"></button>
  <span class="page-status"><span data-text="{msg.page_label}"></span> <b data-text="{page}" data-text-format="number"></b></span>
  <span data-live="player_game" data-filter="player_id=eq.{owner_id}&amp;offset={next_offset}&amp;limit=1" data-order='day.desc' data-empty=""><template data-item><i data-next-page hidden></i></template></span>
  <button id="player-appearances-next" type="button" class="btn-quiet page-next" data-text="{msg.page_next}"></button>
</nav>
  </div>
</div>
          </section>
        </div>
        <aside class="side">
          <p><a data-route="equipes" data-text="{msg.back_teams}"></a></p>
          <p data-text="{msg.about}"></p>
        </aside>
      </div>
    </article>
  </template>
</div>
</section>
