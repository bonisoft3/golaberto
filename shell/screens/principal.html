<!-- generated by pronto from program.cue — do not edit -->
<section class="screen" data-screen="principal">
<header class="masthead">
  <a class="wordmark" data-route="principal" aria-label="{msg.brand}"><b data-text="{msg.brand_gol}"></b><span data-text="{msg.brand_aberto}"></span></a>
  <nav class="langs" aria-label="{msg.lang_label}">
    <a data-route="principal" data-locale="pt-BR" data-locale-current="page" lang="pt-BR"><span class="long" data-text="{msg.lang_pt}"></span><span class="short" data-text="{msg.lang_pt_short}"></span></a>
    <a data-route="principal" data-locale="es-AR" data-locale-current="page" lang="es-AR"><span class="long" data-text="{msg.lang_es}"></span><span class="short" data-text="{msg.lang_es_short}"></span></a>
    <a data-route="principal" data-locale="en-GB" data-locale-current="page" lang="en-GB"><span class="long" data-text="{msg.lang_en}"></span><span class="short" data-text="{msg.lang_en_short}"></span></a>
    <a data-route="principal" data-locale="it-IT" data-locale-current="page" lang="it-IT"><span class="long" data-text="{msg.lang_it}"></span><span class="short" data-text="{msg.lang_it_short}"></span></a>
    <a data-route="principal" data-locale="de-DE" data-locale-current="page" lang="de-DE"><span class="long" data-text="{msg.lang_de}"></span><span class="short" data-text="{msg.lang_de_short}"></span></a>
    <a data-route="principal" data-locale="fr-FR" data-locale-current="page" lang="fr-FR"><span class="long" data-text="{msg.lang_fr}"></span><span class="short" data-text="{msg.lang_fr_short}"></span></a>
  </nav>
</header>
<h1 class="band" data-text="{msg.home_title}"></h1>
<div class="page">
  <div class="content">
    <p class="lead" data-text="{msg.home_lead}"></p>
    <section class="feature" data-live="championship" data-filter="featured=is.true&limit=1" data-order="begins.desc" data-empty="">
      <template data-item>
        <div class="feature-body">
          <div class="feature-head">
            <h2 data-text="{full_name}"></h2>
            <a data-route="campeonato" data-param-id="{id}" data-text="{msg.home_table_link}"></a>
          </div>
          <div class="feature-phase" data-live="phase" data-filter="championship_id=eq.{id}&limit=1" data-order="position.asc" data-empty="">
            <template data-item>
              <div class="feature-grid">
                <div class="rounds" data-live="phase_round" data-filter="phase_id=eq.{id}" data-empty="">
                  <template data-item>
                    <div class="round-pair">
                      <section class="round">
                        <h3><span data-text="{msg.round}"></span> <span data-text="{current}"></span> <small data-text="{msg.home_results}"></small></h3>
<ol class="games" data-live="game_card" data-filter="phase_id=eq.{phase_id}&round=eq.{current}" data-order="day.asc,kickoff.asc" data-empty="{msg.round_empty}">
  <template data-item>
    <li><a class="game-row" data-route="jogo" data-param-id="{id}" data-played="{played}">
      <span class="when"><span class="day" data-text="{day_display}"></span> <span class="hour" data-text="{kickoff_local}"></span></span>
      <span class="home" data-text="{home_name}"></span>
      <span class="score"><b data-text="{home_score}"></b><i>x</i><b data-text="{away_score}"></b></span>
      <span class="away" data-text="{away_name}"></span>
    </a></li>
  </template>
</ol>
                      </section>
                      <div class="round-next" data-live="phase_round" data-filter="id=eq.{id}&next=not.is.null" data-empty="">
                        <template data-item>
                          <section class="round">
                            <h3><span data-text="{msg.round}"></span> <span data-text="{next}"></span> <small data-text="{msg.home_upcoming}"></small></h3>
<ol class="games" data-live="game_card" data-filter="phase_id=eq.{phase_id}&round=eq.{next}" data-order="day.asc,kickoff.asc" data-empty="{msg.round_empty}">
  <template data-item>
    <li><a class="game-row" data-route="jogo" data-param-id="{id}" data-played="{played}">
      <span class="when"><span class="day" data-text="{day_display}"></span> <span class="hour" data-text="{kickoff_local}"></span></span>
      <span class="home" data-text="{home_name}"></span>
      <span class="score"><b data-text="{home_score}"></b><i>x</i><b data-text="{away_score}"></b></span>
      <span class="away" data-text="{away_name}"></span>
    </a></li>
  </template>
</ol>
                          </section>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
                <div class="top" data-live="stage_group" data-filter="phase_id=eq.{id}&limit=1" data-order="position.asc,name.asc" data-empty="">
                  <template data-item>
                    <section class="top-six">
                      <h3 data-text="{msg.home_top6}"></h3>
                      <div class="table-wrap">
                        <table class="grid standings">
                          <thead><tr>
	                            <th scope="col" class="pos"><abbr title="{msg.col_position_long}" data-text="{msg.col_position}"></abbr></th>
	                            <th scope="col" class="name" data-text="{msg.col_team}"></th>
	                            <th scope="col" class="num pts"><abbr title="{msg.col_points_long}" data-text="{msg.col_points}"></abbr></th>
	                            <th scope="col" class="num"><abbr title="{msg.col_played_long}" data-text="{msg.col_played}"></abbr></th>
	                            <th scope="col" class="num wide"><abbr title="{msg.col_wins_long}" data-text="{msg.col_wins}"></abbr></th>
	                            <th scope="col" class="num wide"><abbr title="{msg.col_draws_long}" data-text="{msg.col_draws}"></abbr></th>
	                            <th scope="col" class="num wide"><abbr title="{msg.col_losses_long}" data-text="{msg.col_losses}"></abbr></th>
	                            <th scope="col" class="num wide"><abbr title="{msg.col_for_long}" data-text="{msg.col_for}"></abbr></th>
	                            <th scope="col" class="num wide"><abbr title="{msg.col_against_long}" data-text="{msg.col_against}"></abbr></th>
	                            <th scope="col" class="num"><abbr title="{msg.col_diff_long}" data-text="{msg.col_diff}"></abbr></th>
	                            <th scope="col" class="form wide" data-text="{msg.col_form}"></th>
                            <th scope="col" class="odds"><abbr title="{msg.col_title_chance_long}" data-text="{msg.col_title_chance}"></abbr></th>
                          </tr></thead>
                          <tbody data-live="standing" data-filter="group_id=eq.{id}&position=lte.6" data-order="position.asc" data-empty="{msg.no_teams}">
                            <template data-item>
                              <tr data-zone="{zone}">
	                                <td class="pos" data-text="{position}"></td>
	                                <td class="name"><a data-route="equipe" data-param-id="{team_id}" data-text="{team_name}"></a></td>
	                                <td class="num pts" data-text="{points}"></td>
	                                <td class="num" data-text="{played}"></td>
	                                <td class="num wide" data-text="{wins}"></td>
	                                <td class="num wide" data-text="{draws}"></td>
	                                <td class="num wide" data-text="{losses}"></td>
	                                <td class="num wide" data-text="{goals_for}"></td>
	                                <td class="num wide" data-text="{goals_against}"></td>
	                                <td class="num" data-text="{goal_diff}"></td>
	                                <td class="form wide"><i data-result="{form1}" title="{msg[form1]}"></i><i data-result="{form2}" title="{msg[form2]}"></i><i data-result="{form3}" title="{msg[form3]}"></i><i data-result="{form4}" title="{msg[form4]}"></i><i data-result="{form5}" title="{msg[form5]}"></i></td>
                                <td class="odds"><span data-live="zone_chance" data-filter="group_id=eq.{group_id}&team_id=eq.{team_id}&color=eq.champion" data-empty=""><template data-item><span class="title-chance" data-band="{band}"><span class="bar" aria-hidden="true"><i></i></span><span data-text="{percent}" data-text-format="number"></span><span class="reach" data-reach="{reach}" title="{msg[reach]}" aria-hidden="true"></span><span class="visually-hidden" data-text="{msg[reach]}"></span></span></template></span></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                      <div class="top-foot" data-live="team_chance" data-filter="group_id=eq.{id}&rank=eq.1" data-empty=""><template data-item><a class="btn-quiet chances-link" data-route="chances" data-param-id="{group_id}" data-text="{msg.chances_link}"></a></template></div>
                    </section>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </section>
    <h2 class="recent-title" data-text="{msg.home_recent}"></h2>
    <div class="regions">
<section class="recent">
  <h2 data-text="{msg.world}"></h2>
  <ul class="champ-list" data-live="championship" data-filter="region=eq.world&limit=6" data-order="begins.desc" data-empty="{msg.home_empty}">
    <template data-item>
      <li><a data-route="campeonato" data-param-id="{id}" data-text="{full_name}"></a></li>
    </template>
  </ul>
</section>
<section class="recent">
  <h2 data-text="{msg.continental}"></h2>
  <ul class="champ-list" data-live="championship" data-filter="region=eq.continental&limit=6" data-order="begins.desc" data-empty="{msg.home_empty}">
    <template data-item>
      <li><a data-route="campeonato" data-param-id="{id}" data-text="{full_name}"></a></li>
    </template>
  </ul>
</section>
<section class="recent">
  <h2 data-text="{msg.national}"></h2>
  <ul class="champ-list" data-live="championship" data-filter="region=eq.national&limit=6" data-order="begins.desc" data-empty="{msg.home_empty}">
    <template data-item>
      <li><a data-route="campeonato" data-param-id="{id}" data-text="{full_name}"></a></li>
    </template>
  </ul>
</section>
    </div>
    <p class="more"><a data-route="campeonatos" data-text="{msg.home_all}"></a></p>
  </div>
  <aside class="side"><p data-text="{msg.about}"></p></aside>
</div>
</section>
