schema:
  app_user:
    durability: server
    fields:
      - name: id
        pk: true
        type: uuid
        required: true
      - bounds:
          sizeMin: 1
        name: handle
        type: string
        required: true
        unique: true
      - default: now()
        name: created_at
        type: timestamp
        required: true
  category:
    durability: server
    fields:
      - default: gen_random_uuid()
        name: id
        pk: true
        type: uuid
        required: true
      - bounds:
          sizeMin: 1
          sizeMax: 40
        name: name
        type: string
        required: true
        unique: true
  championship:
    durability: server
    fields:
      - default: gen_random_uuid()
        name: id
        pk: true
        type: uuid
        required: true
      - bounds:
          sizeMin: 1
          sizeMax: 120
        name: name
        type: string
        required: true
      - name: category_id
        ref: category
        type: uuid
        required: false
      - default: '''national'''
        enum:
          - world
          - continental
          - national
        name: region
        type: string
        required: true
      - bounds:
          sizeMin: 1
          sizeMax: 60
        name: region_name
        type: string
        required: true
      - name: begins
        type: date
        required: true
      - name: ends
        type: date
        required: true
      - bounds:
          intMin: 0
          intMax: 9
        default: '3'
        name: point_win
        type: int32
        required: true
      - bounds:
          intMin: 0
          intMax: 9
        default: '1'
        name: point_draw
        type: int32
        required: true
      - bounds:
          intMin: 0
          intMax: 9
        default: '0'
        name: point_loss
        type: int32
        required: true
      - default: 'false'
        name: show_country
        type: bool
        required: true
      - name: season
        type: string
        required: true
      - name: full_name
        type: string
        required: true
      - default: 'false'
        name: featured
        type: bool
        required: true
      - name: search_name
        type: string
        required: true
      - name: search_key
        type: string
        required: true
      - bounds:
          regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
        default: ''''''
        name: slug
        type: string
        required: true
        unique: true
      - name: created_by
        ref: app_user
        type: uuid
        required: false
      - name: updated_by
        ref: app_user
        type: uuid
        required: false
  home_championship:
    durability: live
    fields:
      - name: id
        pk: true
        ref: championship
        type: uuid
        required: true
      - name: region
        type: string
        required: true
      - name: region_name
        type: string
        required: true
      - name: full_name
        type: string
        required: true
      - name: strength
        type: double
        required: true
  phase:
    durability: server
    fields:
      - default: gen_random_uuid()
        name: id
        pk: true
        type: uuid
        required: true
      - name: championship_id
        ref: championship
        type: uuid
        required: true
      - bounds:
          sizeMin: 1
          sizeMax: 60
        name: name
        type: string
        required: true
      - bounds:
          intMin: 0
        default: '0'
        name: position
        type: int32
        required: true
      - bounds:
          regex: '^(pt|w|gd|gf|name|g_average|gp|g_aet|head|g_away|bias)(,(pt|w|gd|gf|name|g_average|gp|g_aet|head|g_away|bias))*$'
        default: '''pt,w,gd,gf,gp,g_away,name'''
        name: sort
        type: string
        required: true
      - bounds:
          intMin: 0
          intMax: 9
        default: '0'
        name: bonus_points
        type: int32
        required: true
      - bounds:
          intMin: 0
          intMax: 99
        default: '0'
        name: bonus_points_threshold
        type: int32
        required: true
      - name: created_by
        ref: app_user
        type: uuid
        required: false
      - name: updated_by
        ref: app_user
        type: uuid
        required: false
  stage_group:
    durability: server
